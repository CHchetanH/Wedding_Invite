<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" preserveAspectRatio="xMidYMid slice"><style>
svg{display:block}
.bob{animation:bob .9s ease-in-out infinite alternate}
.bob2{animation:bob 1.1s ease-in-out infinite alternate-reverse}
.hop{animation:hop .7s ease-in-out infinite}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.swA{animation:swA .8s ease-in-out infinite alternate}
.swB{animation:swA .8s ease-in-out infinite alternate-reverse}
@keyframes swA{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
.tap{animation:tap .45s ease-in-out infinite alternate}
.tap2{animation:tap .45s ease-in-out infinite alternate-reverse}
@keyframes tap{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.apply{animation:apply 1.3s ease-in-out infinite}
@keyframes apply{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
.apply2{animation:apply 1.3s ease-in-out infinite .5s}
.sway{animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.skirt{animation:skirt .8s ease-in-out infinite alternate}
@keyframes skirt{from{transform:scaleX(.92)}to{transform:scaleX(1.08)}}
.fall{animation:fall 7s linear infinite;opacity:0}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.95}90%{opacity:.9}100%{transform:translate(var(--sw),215px) rotate(300deg);opacity:0}}
.tw{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3);opacity:.25}50%{transform:scale(1.15);opacity:1}}
.blink{animation:blink 1.6s steps(1) infinite}
.blink2{animation:blink 1.6s steps(1) infinite .8s}
@keyframes blink{50%{opacity:.25}}
.note{animation:note 4s ease-in infinite;opacity:0}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--nx),-90px);opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.12}to{opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
